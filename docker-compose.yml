name: dc-mongo

services:
  mongo:
    image: mongo:7.0.11-jammy
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-adminpass}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-appdb}
    volumes:
      - ./docker_volumes/mongo/mongo_data:/data/db
      - ./docker_volumes/mongo/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DC_MONGO_PORT:-27017}:27017"
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/${MONGO_DATABASE:-appdb} --quiet
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 20s
    command: ["mongod", "--wiredTigerCacheSizeGB", "${MONGO_CACHE_SIZE_GB:-0.25}"]

  mongo-express:
    image: mongo-express:1.0.2
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USERNAME:-admin}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD:-adminpass}
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGOEXPRESS_USERNAME:-mexpress}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGOEXPRESS_PASSWORD:-mexpress123}
    ports:
      - "${DC_MONGOEXPRESS_PORT:-8081}:8081"
    depends_on:
      mongo:
        condition: service_healthy

  mongosh:
    image: mongo:7.0.11-jammy
    profiles: ["tools"]
    environment:
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-adminpass}
      MONGO_DATABASE: ${MONGO_DATABASE:-appdb}
    entrypoint: mongosh "mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-adminpass}@mongo:27017/${MONGO_DATABASE:-appdb}?authSource=admin"
    depends_on:
      mongo:
        condition: service_healthy

  mongo-backup:
    image: mongo:7.0.11-jammy
    profiles: ["tools"]
    volumes:
      - ./backups:/backups
    entrypoint: >
      mongodump
        --host=mongo
        --port=27017
        --username=${MONGO_ROOT_USERNAME:-admin}
        --password=${MONGO_ROOT_PASSWORD:-adminpass}
        --authenticationDatabase=admin
        --db=${MONGO_DATABASE:-appdb}
        --out=/backups/dump_$(date +%Y%m%d_%H%M%S)
    depends_on:
      mongo:
        condition: service_healthy

  mongo-restore:
    image: mongo:7.0.11-jammy
    profiles: ["tools"]
    volumes:
      - ./backups:/backups
    entrypoint: >
      mongorestore
        --host=mongo
        --port=27017
        --username=${MONGO_ROOT_USERNAME:-admin}
        --password=${MONGO_ROOT_PASSWORD:-adminpass}
        --authenticationDatabase=admin
        --db=${MONGO_DATABASE:-appdb}
        /backups/${RESTORE_DIR:-latest}/${MONGO_DATABASE:-appdb}
    depends_on:
      mongo:
        condition: service_healthy
