services:
  mongo:
    image: mongo:7.0-jammy  # latest: 7.0.30-jammy
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-adminpass}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-appdb}
    command: ["mongod", "--wiredTigerCacheSizeGB", "${MONGO_CACHE_SIZE_GB:-0.25}"]
    ports:
      - "127.0.0.1:${DC_MONGO_PORT:-27017}:27017"
    restart: always
    volumes:
      - ./.docker_volumes/mongo:/data/db
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.runCommand(\"ping\").ok' | mongosh localhost:27017/${MONGO_DATABASE:-appdb} --quiet"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  mongo-express:
    image: mongo-express:1
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USERNAME:-admin}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD:-adminpass}
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGOEXPRESS_USERNAME:-mexpress}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGOEXPRESS_PASSWORD:-mexpress123}
    ports:
      - "127.0.0.1:${DC_MONGOEXPRESS_PORT:-8081}:8081"
    depends_on:
      mongo:
        condition: service_healthy

  mongo-backup:
    image: mongo:7.0-jammy
    profiles: ["tools"]
    entrypoint: [""]
    command: ["bash", "/scripts/backup_db"]
    env_file:
      - .env
    working_dir: /backups
    volumes:
      - ./.docker_volumes/backups:/backups
      - ./scripts:/scripts:ro
    depends_on:
      mongo:
        condition: service_healthy
